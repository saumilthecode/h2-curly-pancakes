<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Hash checksum flow</title>
  <desc id="desc">A message is passed through a hash algorithm to produce a checksum. The receiver recomputes the checksum and compares it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .data { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .hash { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="390" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Checksum idea: recompute and compare</text>
  <text x="54" y="102" class="small">Hashing is mainly used for checking, not for decrypting.</text>

  <rect x="70" y="150" width="170" height="70" rx="14" class="data"/>
  <text x="112" y="193" class="label">abcde</text>
  <text x="91" y="247" class="small">message</text>

  <path d="M 255 185 L 350 185" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="370" y="138" width="215" height="95" rx="16" class="hash"/>
  <text x="407" y="177" class="label">hash algorithm</text>
  <text x="420" y="207" class="small">ord, weights, mod</text>

  <path d="M 600 185 L 690 185" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="710" y="150" width="145" height="70" rx="14" class="ok"/>
  <text x="769" y="193" class="label">5</text>
  <text x="722" y="247" class="small">checksum</text>

  <rect x="220" y="300" width="640" height="54" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="248" y="334" class="small">send: data + checksum</text>
  <text x="456" y="334" class="label">abcde5</text>
  <text x="570" y="334" class="small">receiver recomputes -> match means likely OK</text>
</svg>
