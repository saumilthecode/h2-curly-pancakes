<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Queue FIFO diagram</title>
  <desc id="desc">A horizontal queue showing dequeue from the head and enqueue at the tail.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .person { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .head { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
      .tail { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="380" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Queue: FIFO</text>
  <text x="54" y="102" class="small">First person in the line is the first person served.</text>

  <rect x="185" y="165" width="710" height="108" rx="22" class="lane"/>
  <rect x="220" y="188" width="130" height="62" rx="12" class="head"/><text x="247" y="227" class="label">Jane</text>
  <rect x="365" y="188" width="130" height="62" rx="12" class="person"/><text x="391" y="227" class="label">Asyraf</text>
  <rect x="510" y="188" width="130" height="62" rx="12" class="person"/><text x="551" y="227" class="label">Sam</text>
  <rect x="655" y="188" width="130" height="62" rx="12" class="tail"/><text x="688" y="227" class="label">Sally</text>

  <path d="M 205 219 L 105 219" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="63" y="190" class="label" fill="#dc2626">dequeue()</text>
  <text x="74" y="250" class="small">removes head</text>

  <path d="M 915 219 L 805 219" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="894" y="190" class="label" fill="#2563eb">enqueue(Lee)</text>
  <text x="902" y="250" class="small">joins tail</text>

  <text x="235" y="303" class="small">head = index 0</text>
  <text x="652" y="303" class="small">tail = end of list</text>
  <rect x="343" y="325" width="395" height="38" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="375" y="351" class="small">[Jane, Asyraf, Sam, Sally]</text>
</svg>
