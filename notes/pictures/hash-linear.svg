<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Linear probing collision resolution</title>
  <desc id="desc">A collision at index 3 probes index 4 and stores the item there.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .slot { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .home { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
      .stored { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .filled { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="460" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Collision resolution: linear probing</text>
  <text x="54" y="102" class="small">If home slot is full, scan forward and wrap around until an empty slot appears.</text>

  <g transform="translate(110 185)">
    <rect x="0" y="0" width="140" height="82" rx="12" class="filled"/><text x="53" y="34" class="small">0</text><text x="42" y="62" class="label">bdac</text>
    <rect x="160" y="0" width="140" height="82" rx="12" class="slot"/><text x="213" y="34" class="small">1</text><text x="204" y="62" class="small">empty</text>
    <rect x="320" y="0" width="140" height="82" rx="12" class="filled"/><text x="373" y="34" class="small">2</text><text x="362" y="62" class="label">cdab</text>
    <rect x="480" y="0" width="140" height="82" rx="12" class="home"/><text x="533" y="34" class="small">3</text><text x="522" y="62" class="label">dbac</text>
    <rect x="640" y="0" width="140" height="82" rx="12" class="stored"/><text x="693" y="34" class="small">4</text><text x="682" y="62" class="label">badc</text>
  </g>

  <text x="610" y="158" class="label" fill="#dc2626">badc home = index 3</text>
  <path d="M 695 168 C 695 128, 673 125, 661 184" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 710 278 C 742 328, 815 328, 830 278" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="690" y="358" class="small">3 full -> try 4 -> empty slot found</text>
  <text x="305" y="330" class="label" fill="#16a34a">badc stored at index 4</text>
</svg>
