<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Hash table indexing</title>
  <desc id="desc">A string is hashed, modulo table size chooses the index, and the item is stored there.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .slot { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .hit { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="480" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Hash table: hash value chooses an array index</text>

  <rect x="70" y="145" width="150" height="64" rx="14" class="blue"/>
  <text x="113" y="185" class="label">cdab</text>
  <path d="M 235 177 L 325 177" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="345" y="130" width="205" height="95" rx="16" class="amber"/>
  <text x="386" y="169" class="label">hash(cdab)</text>
  <text x="424" y="199" class="small">= 982</text>
  <path d="M 565 177 L 655 177" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="675" y="130" width="190" height="95" rx="16" class="green"/>
  <text x="719" y="169" class="label">982 % 5</text>
  <text x="762" y="199" class="small">= 2</text>

  <rect x="245" y="285" width="590" height="150" rx="18" class="box"/>
  <text x="274" y="323" class="label">table size = 5</text>
  <g transform="translate(285 348)">
    <rect x="0" y="0" width="92" height="58" rx="10" class="slot"/><text x="38" y="36" class="label">0</text>
    <rect x="104" y="0" width="92" height="58" rx="10" class="slot"/><text x="142" y="36" class="label">1</text>
    <rect x="208" y="0" width="92" height="58" rx="10" class="hit"/><text x="230" y="36" class="label">cdab</text>
    <rect x="312" y="0" width="92" height="58" rx="10" class="slot"/><text x="350" y="36" class="label">3</text>
    <rect x="416" y="0" width="92" height="58" rx="10" class="slot"/><text x="454" y="36" class="label">4</text>
  </g>
  <text x="505" y="458" class="small">index 2 stores the item</text>
</svg>
