<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Separate chaining collision resolution</title>
  <desc id="desc">Two items hash to index 3, so the slot stores a list containing both items.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .slot { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .item { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .chain { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="480" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Collision resolution: separate chaining</text>
  <text x="54" y="102" class="small">If a slot is already occupied, store a small list at that index.</text>

  <rect x="95" y="145" width="890" height="270" rx="18" class="panel"/>
  <g transform="translate(135 190)">
    <rect x="0" y="0" width="90" height="56" rx="10" class="slot"/><text x="38" y="35" class="label">0</text>
    <rect x="0" y="70" width="90" height="56" rx="10" class="slot"/><text x="38" y="105" class="label">1</text>
    <rect x="0" y="140" width="90" height="56" rx="10" class="slot"/><text x="38" y="175" class="label">2</text>
    <rect x="0" y="210" width="90" height="56" rx="10" class="slot"/><text x="38" y="245" class="label">3</text>
  </g>
  <rect x="260" y="190" width="145" height="56" rx="10" class="item"/><text x="302" y="225" class="label">bdac</text>
  <rect x="260" y="330" width="145" height="56" rx="10" class="item"/><text x="302" y="365" class="label">cdab</text>
  <rect x="260" y="400" width="330" height="56" rx="10" class="chain"/>
  <text x="292" y="435" class="label">["dbac", "badc"]</text>
  <text x="617" y="435" class="small">both hashed to 3</text>
  <path d="M 728 135 L 530 395" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="750" y="140" class="label">badc collides</text>
  <text x="750" y="170" class="small">append to chain</text>
</svg>
