<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Balanced brackets stack diagram</title>
  <desc id="desc">Opening brackets are pushed to a stack and closing brackets pop the latest opening bracket for matching.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .open { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .close { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1000" height="380" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="68" class="title">Balanced brackets: latest opening must close first</text>

  <rect x="60" y="116" width="255" height="220" rx="18" class="panel"/>
  <text x="88" y="154" class="label">read openings</text>
  <rect x="92" y="184" width="46" height="44" rx="8" class="open"/><text x="108" y="213" class="label">(</text>
  <rect x="152" y="184" width="46" height="44" rx="8" class="open"/><text x="169" y="213" class="label">[</text>
  <rect x="212" y="184" width="46" height="44" rx="8" class="open"/><text x="228" y="213" class="label">{</text>
  <text x="91" y="270" class="small">push each one</text>

  <path d="M 330 225 L 420 225" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="440" y="108" width="180" height="240" rx="18" class="panel"/>
  <text x="486" y="147" class="label">stack</text>
  <rect x="500" y="174" width="60" height="42" rx="8" class="open"/><text x="522" y="202" class="label">{</text>
  <rect x="500" y="222" width="60" height="42" rx="8" class="open"/><text x="523" y="250" class="label">[</text>
  <rect x="500" y="270" width="60" height="42" rx="8" class="open"/><text x="522" y="298" class="label">(</text>
  <text x="566" y="201" class="small">top</text>

  <path d="M 635 225 L 725 225" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="745" y="116" width="235" height="220" rx="18" class="panel"/>
  <text x="775" y="154" class="label">read closings</text>
  <rect x="782" y="184" width="46" height="44" rx="8" class="close"/><text x="798" y="213" class="label">}</text>
  <text x="842" y="213" class="small">matches {</text>
  <rect x="782" y="239" width="46" height="44" rx="8" class="close"/><text x="799" y="267" class="label">]</text>
  <text x="842" y="267" class="small">matches [</text>
  <rect x="782" y="294" width="46" height="44" rx="8" class="close"/><text x="798" y="322" class="label">)</text>
  <text x="842" y="322" class="small">matches (</text>
</svg>
