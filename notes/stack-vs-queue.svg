<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Stack versus queue</title>
  <desc id="desc">Comparison of removing from a stack and removing from a queue using the same values 1, 2, and 3.</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 23px; }
      .small { font-size: 18px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .red { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .base { stroke: #334155; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="480" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Same data, different removal rule</text>

  <rect x="60" y="115" width="450" height="320" rx="20" class="panel"/>
  <text x="95" y="155" class="label">Stack: LIFO</text>
  <text x="95" y="184" class="small">newest item leaves first</text>
  <rect x="210" y="225" width="90" height="48" rx="9" class="red"/><text x="247" y="256" class="label">3</text>
  <rect x="210" y="279" width="90" height="48" rx="9" class="blue"/><text x="247" y="310" class="label">2</text>
  <rect x="210" y="333" width="90" height="48" rx="9" class="blue"/><text x="247" y="364" class="label">1</text>
  <line x1="195" y1="395" x2="315" y2="395" class="base"/>
  <path d="M 310 250 L 395 215" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="370" y="200" class="label" fill="#dc2626">pop -> 3</text>

  <rect x="570" y="115" width="450" height="320" rx="20" class="panel"/>
  <text x="605" y="155" class="label">Queue: FIFO</text>
  <text x="605" y="184" class="small">oldest item leaves first</text>
  <rect x="650" y="266" width="90" height="55" rx="10" class="red"/><text x="687" y="302" class="label">1</text>
  <rect x="752" y="266" width="90" height="55" rx="10" class="blue"/><text x="789" y="302" class="label">2</text>
  <rect x="854" y="266" width="90" height="55" rx="10" class="green"/><text x="891" y="302" class="label">3</text>
  <text x="650" y="348" class="small">head</text>
  <text x="880" y="348" class="small">tail</text>
  <path d="M 642 294 L 585 294" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="600" y="235" class="label" fill="#dc2626">dequeue -> 1</text>
</svg>
