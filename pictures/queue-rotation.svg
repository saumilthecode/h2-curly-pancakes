<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Queue rotation diagram</title>
  <desc id="desc">A queue rotation moves the head item to the tail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .item { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .move { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="390" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Rotating a queue</text>
  <text x="54" y="102" class="small">Rotate once = dequeue the head, then enqueue it at the tail.</text>

  <g transform="translate(70 150)">
    <rect width="245" height="150" rx="18" class="panel"/>
    <text x="26" y="38" class="label">start</text>
    <rect x="26" y="70" width="44" height="44" rx="8" class="move"/><text x="39" y="99" class="label">A</text>
    <rect x="78" y="70" width="44" height="44" rx="8" class="item"/><text x="91" y="99" class="label">B</text>
    <rect x="130" y="70" width="44" height="44" rx="8" class="item"/><text x="143" y="99" class="label">C</text>
    <rect x="182" y="70" width="44" height="44" rx="8" class="item"/><text x="195" y="99" class="label">D</text>
  </g>

  <path d="M 330 225 L 415 225" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="339" y="204" class="small">move A to tail</text>

  <g transform="translate(430 150)">
    <rect width="245" height="150" rx="18" class="panel"/>
    <text x="26" y="38" class="label">rotate once</text>
    <rect x="26" y="70" width="44" height="44" rx="8" class="item"/><text x="39" y="99" class="label">B</text>
    <rect x="78" y="70" width="44" height="44" rx="8" class="item"/><text x="91" y="99" class="label">C</text>
    <rect x="130" y="70" width="44" height="44" rx="8" class="item"/><text x="143" y="99" class="label">D</text>
    <rect x="182" y="70" width="44" height="44" rx="8" class="move"/><text x="195" y="99" class="label">A</text>
  </g>

  <path d="M 690 225 L 775 225" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="699" y="204" class="small">move B to tail</text>

  <g transform="translate(790 150)">
    <rect width="245" height="150" rx="18" class="panel"/>
    <text x="26" y="38" class="label">rotate twice</text>
    <rect x="26" y="70" width="44" height="44" rx="8" class="item"/><text x="39" y="99" class="label">C</text>
    <rect x="78" y="70" width="44" height="44" rx="8" class="item"/><text x="91" y="99" class="label">D</text>
    <rect x="130" y="70" width="44" height="44" rx="8" class="move"/><text x="143" y="99" class="label">A</text>
    <rect x="182" y="70" width="44" height="44" rx="8" class="move"/><text x="195" y="99" class="label">B</text>
  </g>
</svg>
