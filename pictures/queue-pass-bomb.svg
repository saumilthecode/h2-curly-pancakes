<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Pass the bomb queue trace</title>
  <desc id="desc">Trace for players A, B, and C with n equals 1. Rotate once, remove next player, repeat until C wins.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .item { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .remove { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
      .win { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1040" height="390" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="70" class="title">Pass the bomb: rotate 1, then remove</text>
  <text x="54" y="102" class="small">Notebook rule for [A, B, C], n = 1</text>

  <g transform="translate(70 150)">
    <rect width="190" height="150" rx="18" class="panel"/>
    <text x="22" y="38" class="label">start</text>
    <rect x="22" y="70" width="44" height="44" rx="8" class="item"/><text x="35" y="99" class="label">A</text>
    <rect x="74" y="70" width="44" height="44" rx="8" class="remove"/><text x="87" y="99" class="label">B</text>
    <rect x="126" y="70" width="44" height="44" rx="8" class="item"/><text x="139" y="99" class="label">C</text>
  </g>
  <path d="M 275 225 L 355 225" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="282" y="204" class="small">rotate A</text>

  <g transform="translate(370 150)">
    <rect width="220" height="150" rx="18" class="panel"/>
    <text x="22" y="38" class="label">remove B</text>
    <rect x="35" y="70" width="44" height="44" rx="8" class="item"/><text x="48" y="99" class="label">C</text>
    <rect x="87" y="70" width="44" height="44" rx="8" class="item"/><text x="100" y="99" class="label">A</text>
    <rect x="139" y="70" width="44" height="44" rx="8" class="remove"/><text x="152" y="99" class="label">B</text>
  </g>
  <path d="M 605 225 L 685 225" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="612" y="204" class="small">rotate C</text>

  <g transform="translate(700 150)">
    <rect width="220" height="150" rx="18" class="panel"/>
    <text x="22" y="38" class="label">remove A</text>
    <rect x="50" y="70" width="44" height="44" rx="8" class="win"/><text x="63" y="99" class="label">C</text>
    <rect x="102" y="70" width="44" height="44" rx="8" class="remove"/><text x="115" y="99" class="label">A</text>
  </g>

  <rect x="805" y="325" width="205" height="46" rx="12" class="win"/>
  <text x="842" y="355" class="label">winner = C</text>
</svg>
