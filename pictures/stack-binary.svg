<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Denary to binary using stack</title>
  <desc id="desc">Division remainders are pushed into a stack, then popped to form the binary answer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-weight: 750; font-size: 28px; }
      .label { font-weight: 700; font-size: 22px; }
      .small { font-size: 18px; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .bit { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .top { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .answer { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
    </style>
  </defs>
  <rect x="20" y="20" width="1000" height="480" rx="22" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="54" y="68" class="title">Why stack helps denary -> binary</text>
  <text x="54" y="99" class="small">Remainders are found bottom-up, but the answer is read top-down.</text>

  <rect x="55" y="135" width="285" height="305" rx="18" class="panel"/>
  <text x="82" y="174" class="label">divide by 2</text>
  <text x="82" y="213" class="small">47 -> rem 1</text>
  <text x="82" y="246" class="small">23 -> rem 1</text>
  <text x="82" y="279" class="small">11 -> rem 1</text>
  <text x="82" y="312" class="small">5  -> rem 1</text>
  <text x="82" y="345" class="small">2  -> rem 0</text>
  <text x="82" y="378" class="small">1  -> rem 1</text>
  <text x="82" y="415" class="small">push each remainder</text>

  <path d="M 350 287 L 430 287" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="450" y="125" width="180" height="330" rx="18" class="panel"/>
  <text x="492" y="163" class="label">stack</text>
  <rect x="505" y="181" width="70" height="38" rx="8" class="top"/><text x="534" y="207" class="label">1</text>
  <rect x="505" y="224" width="70" height="38" rx="8" class="bit"/><text x="534" y="250" class="label">0</text>
  <rect x="505" y="267" width="70" height="38" rx="8" class="bit"/><text x="534" y="293" class="label">1</text>
  <rect x="505" y="310" width="70" height="38" rx="8" class="bit"/><text x="534" y="336" class="label">1</text>
  <rect x="505" y="353" width="70" height="38" rx="8" class="bit"/><text x="534" y="379" class="label">1</text>
  <rect x="505" y="396" width="70" height="38" rx="8" class="bit"/><text x="534" y="422" class="label">1</text>
  <text x="584" y="207" class="small">top</text>

  <path d="M 645 287 L 725 287" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="745" y="170" width="230" height="190" rx="18" class="panel"/>
  <text x="792" y="210" class="label">pop order</text>
  <rect x="785" y="242" width="150" height="48" rx="10" class="answer"/>
  <text x="807" y="274" class="label">101111</text>
  <text x="790" y="327" class="small">47 base 10</text>
  <text x="878" y="327" class="small">=</text>
  <text x="900" y="327" class="small">101111 base 2</text>
</svg>
